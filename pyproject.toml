[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runflow"
version = "0.1.0"
description = "Typed async workflow runtime for batched node graphs."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.115",
    "nats-py>=2.10",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "runflow*", "runner*", "shared*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
