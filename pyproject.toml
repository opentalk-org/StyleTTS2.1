[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runflow"
version = "0.1.0"
description = "Typed async workflow runtime for batched node graphs."
requires-python = ">=3.11"
dependencies = [
    "aim>=3.25",
    "boto3>=1.34",
    "fastapi>=0.115",
    "appdirs",
    "click>=8.1",
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "einops>=0.8",
    "einops-exts>=0.0.4",
    "gdown>=5.2",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "monotonic-align",
    "munch>=4.0",
    "nemo-toolkit[asr]>=2.0",
    "nats-py>=2.10",
    "numba>=0.60",
    "openai-whisper>=20240930",
    "pandas>=2.2",
    "phonemizer>=3.3",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pyworld>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    "tqdm>=4.66",
    "transformers>=4.45",
    "uvicorn[standard]>=0.30",
    "whisperx>=3.1",
]

# DeepFilterNet's wheel metadata pins numpy<2, but the rest of the stack (nemo,
# numba, torch) needs numpy>=2 and df imports/runs fine against it. Override the
# constraint so numpy is not dragged down, rather than a side --no-deps install.
# whisperx pulls in pyannote-audio, which would otherwise drag torchaudio/torchvision
# down to the torch-2.8 line while our `torch>=2.11` override keeps torch at 2.11 --
# a mismatched torch stack whose C++ extensions fail to load. Force torchaudio and
# torchvision onto the matching 2.11 / 0.26 line so the whole stack stays consistent.
[tool.uv]
override-dependencies = ["numpy>=2.1,<2.5", "torch>=2.11", "torchaudio>=2.11", "torchvision>=0.26"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
monotonic-align = { git = "https://github.com/resemble-ai/monotonic_align.git", rev = "c6e5e6cb19882164027eb6e35118e841eed9298e" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "runflow*", "runner*", "shared*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
