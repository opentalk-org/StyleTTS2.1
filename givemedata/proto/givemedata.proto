syntax = "proto3";

service GiveMeData {
  rpc Init (InitRequest) returns (InitResponse);
  rpc Data (stream DataRequest) returns (stream DataResponse);
  rpc Asset (AssetRequest) returns (stream AssetResponse);
  rpc Checkpoint (stream CheckpointRequest) returns (CheckpointResponse);
  rpc End (EndRequest) returns (EndResponse);
}

message InitRequest {}

message InitResponse {
  string session_id = 1;
  // verbatim yaml passed through to the training loop, never parsed here
  string train_config = 2;
}

enum Split {
  TRAINING = 0;
  VALIDATION = 1;
}

message DataRequest {
  string session_id = 1;
  Split split = 2;
}

message Sample {
  bytes wave = 1;
  double duration = 2;
  int64 speaker_id = 3;
  int32 language_id = 4;
  bytes text = 5;
}

message DataResponse {
  repeated Sample batch = 1;
}

message AssetRequest {
  string session_id = 1;
  // key into the service's assets map from the data config
  string name = 2;
}

message AssetResponse {
  bytes chunk = 1;
}

message CheckpointMetadata {
  string session_id = 1;
  uint64 step = 2;
}

message CheckpointRequest {
  oneof payload {
    // must be the first message of the stream
    CheckpointMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message CheckpointResponse {}

message EndRequest {
  string session_id = 1;
}

message EndResponse {}
