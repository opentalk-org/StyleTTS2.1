name: Cache Linux dev shells

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devshells:
    name: Dev shells (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
      NIX_SYSTEM: ${{ matrix.system }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check cache publishing configuration
        if: github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_CACHE" || -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "::error::Set the CACHIX_CACHE repository variable and CACHIX_AUTH_TOKEN secret. See docs/nix-cache.md."
            exit 1
          fi

      - name: Make room for Nix build dependencies
        run: |
          # CUDA and Rust builds need more space than the stock runner leaves free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: env.CACHIX_CACHE != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build every dev shell
        run: |
          nix eval --no-update-lock-file --json \
            ".#devShells.$NIX_SYSTEM" --apply builtins.attrNames \
            | jq -r '.[]' > "$RUNNER_TEMP/devshell-names"
          while IFS= read -r name; do
            echo "::group::Build $NIX_SYSTEM.$name"
            # Realize the environment used by nix develop without running shell hooks.
            nix print-dev-env --no-update-lock-file --print-build-logs \
              ".#devShells.$NIX_SYSTEM.\"$name\"" \
              --profile "$RUNNER_TEMP/devshell-$name" > /dev/null
            echo "::endgroup::"
          done < "$RUNNER_TEMP/devshell-names"

      - name: Push shell profiles and their complete closures
        if: github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          while IFS= read -r name; do
            cachix push "$CACHIX_CACHE" "$RUNNER_TEMP/devshell-$name"
          done < "$RUNNER_TEMP/devshell-names"

  verify-cache:
    name: Download cached shells (${{ matrix.system }})
    needs: devshells
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Enter every shell using only substitutes on a fresh runner
        run: |
          nix eval --no-update-lock-file --json \
            ".#devShells.$NIX_SYSTEM" --apply builtins.attrNames \
            | jq -r '.[]' > "$RUNNER_TEMP/devshell-names"
          while IFS= read -r name; do
            nix develop --no-update-lock-file --max-jobs 0 --option builders '' \
              ".#devShells.$NIX_SYSTEM.\"$name\"" -c true
          done < "$RUNNER_TEMP/devshell-names"
