[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runflow"
version = "0.1.0"
description = "Typed async workflow runtime for batched node graphs."
requires-python = ">=3.11"
dependencies = [
    "aim>=3.25",
    "boto3>=1.34",
    "fastapi>=0.115",
    "click>=8.1",
    "einops>=0.8",
    "einops-exts>=0.0.4",
    "gdown>=5.2",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "munch>=4.0",
    "nemo-toolkit[asr]>=2.0",
    "nats-py>=2.10",
    "openai-whisper>=20240930",
    "pandas>=2.2",
    "phonemizer>=3.3",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pyworld>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "torchaudio>=2.3",
    "tqdm>=4.66",
    "transformers>=4.45",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "runflow*", "runner*", "shared*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
