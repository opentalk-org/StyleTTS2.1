[package]
name = "givemedata"
version = "0.0.1"
edition = "2024"
authors = ["Adam Cholewiński <me@adamchol.com>"]

[[bin]]
name = "givemedata"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
blake2 = "0.10.6"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["env", "derive"] }
futures = "0.3.31"
hound = "3.5.1"
prost = "0.13.5"
rand = "0.10.2"
rubato = "5.0.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "sqlx-toml", "tls-rustls"] }
thiserror = "2.0.20"
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.17"
tonic = "0.13.1"
uuid = { version = "1.16.0", features = ["v4"] }

[build-dependencies]
# pure-Rust protobuf compiler, so the build needs no system `protoc`
protox = "0.7.2"
tonic-build = { version = "0.13.1", default-features = false, features = ["prost"] }
