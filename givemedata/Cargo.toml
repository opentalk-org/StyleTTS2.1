[package]
name = "givemedata"
version = "0.0.1"
edition = "2024"
authors = ["Adam Cholewiński <me@adamchol.com>"]

[[bin]]
name = "givemedata"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
blake2 = "0.10.6"
futures = "0.3.31"
prost = "0.13.5"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.17"
tonic = "0.13.1"
uuid = { version = "1.16.0", features = ["v4"] }

[build-dependencies]
# pure-Rust protobuf compiler, so the build needs no system `protoc`
protox = "0.7.2"
tonic-build = { version = "0.13.1", default-features = false, features = ["prost"] }
