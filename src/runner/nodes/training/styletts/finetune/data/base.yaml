validation_every_steps: 1000
checkpoint_every_steps: 10000
log_every_steps: 10
profiling_enabled: false
distributed_processes: 1
device: cuda
batch_size: 2
max_len: 240
second_stage_load_pretrained: true
load_only_params: true
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
model_params:
  multispeaker: true
  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80
  n_token: 178
  max_dur: 50
  style_dim: 128
  dropout: 0.2
  decoder:
    type: hifigan
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 5, 3, 2]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 10, 6, 4]
  slm:
    model: microsoft/wavlm-base-plus
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64
  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0
loss_params:
  lambda_mel: 5.0
  lambda_gen: 1.0
  lambda_slm: 1.0
  lambda_mono: 1.0
  lambda_s2s: 1.0
  lambda_F0: 1.0
  lambda_norm: 1.0
  lambda_dur: 1.0
  lambda_ce: 20.0
  lambda_sty: 1.0
  lambda_diff: 1.0
  diffusion_start_step: 100000
  joint_start_step: 150000
optimizer_params:
  lr: 0.0001
  bert_lr: 1.0e-5
  ft_lr: 0.0001
slmadv_params:
  min_len: 180
  max_len: 200
  batch_max_samples: 0
  iter: 10
  thresh: 5
  scale: 0.01
  sig: 1.5
