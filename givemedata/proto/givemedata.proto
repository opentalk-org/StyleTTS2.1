syntax = "proto3";

service GiveMeData {
  rpc Init (InitRequest) returns (InitResponse);
  rpc Data (stream DataRequest) returns (stream DataResponse);
  rpc End (EndRequest) returns (EndResponse);
}

message InitRequest {}

message InitResponse {
  string session_id = 1;
  // verbatim yaml passed through to the training loop, never parsed here
  string train_config = 2;
}

enum Split {
  TRAINING = 0;
  VALIDATION = 1;
}

message DataRequest {
  string session_id = 1;
  Split split = 2;
}

message Sample {
  bytes wave = 1;
  double duration = 2;
  int64 speaker_id = 3;
  int32 language_id = 4;
  bytes text = 5;
}

message DataResponse {
  repeated Sample batch = 1;
}

message EndRequest {
  string session_id = 1;
}

message EndResponse {}
