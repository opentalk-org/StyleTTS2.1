validation_every_steps: 1000
checkpoint_every_steps: 10000
log_every_steps: 10
profiling_enabled: false
seed: 1
distributed_processes: 1
device: cuda
load_only_params: true
preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300
model_params:
  multispeaker: true
  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80
  n_token: 178
  max_dur: 50
  style_dim: 128
  language_count: 2
  dropout: 0.2
  decoder:
    type: hifigan
    resblock_kernel_sizes: [3, 7, 11]
    upsample_rates: [10, 5, 3, 2]
    upsample_initial_channel: 512
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    upsample_kernel_sizes: [20, 10, 6, 4]
  slm:
    model: microsoft/wavlm-base-plus
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64
  alpha_flow:
    style_scale: 1.0
    transition_start: 1000
    transition_end: 4000
    temperature: 25.0
    conditional_dropout: 0.1
  prosody_quantizer:
    latent_dim: 30
    levels: 8
    stages: 1
    stage_dropout: false
optimizer_params:
  lr: 0.0001
  bert_lr: 1.0e-5
  ft_lr: 0.0001
  gradient_clip_norm: 25.0
