[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runflow"
version = "0.1.0"
description = "Typed async workflow runtime for batched node graphs."
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14",
    "mlflow>=3.7",
    "boto3>=1.34",
    "fastapi>=0.115",
    "appdirs",
    "click>=8.1",
    "deepfilternet==0.5.6",
    "deepfilterlib==0.5.6",
    "einops>=0.8",
    "einops-exts>=0.0.4",
    "faiss-cpu>=1.9",
    "gdown>=5.2",
    "jieba>=0.42",
    "jamo>=0.4.1",
    "jaconv>=0.4",
    "kokoro>=0.9",
    "chatterbox-tts",
    "f5-tts",
    "orpheus-speech",
    "fish-speech",
    "fugashi>=1.5",
    # Kokoro's English G2P (misaki) needs this spaCy model; ship it so it is never
    # fetched at runtime (a runtime `spacy download` shells out to pip and fails in the
    # immutable nix store interpreter).
    "en-core-web-sm",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "monotonic-align",
    "mojimoji>=0.0.13",
    "munch>=4.0",
    "nemo-toolkit[asr]>=2.0",
    "numba>=0.60",
    "onnxruntime>=1.23,<1.24;sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.23,<1.24;sys_platform == 'linux' and platform_machine == 'x86_64'",
    "openai-whisper>=20240930",
    "pandas>=2.2",
    "phaseaug==1.0.1",
    "phonemizer>=3.3",
    "piper-tts[zh]>=1.5.0",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pyarrow>=20.0",
    "pyannote-audio>=4.0,<5",
    "pyopenjtalk>=0.4.1",
    "rapidfuzz>=3.14",
    "pyworld>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "python-mecab-ko>=1.3",
    "ruamel-yaml>=0.17.28,<0.19",
    "soundfile>=0.12",
    "speechbrain>=1.0",
    "sqlalchemy>=2.0",
    "torch>=2.3",
    "torchaudio>=2.3",
    "tqdm>=4.66",
    "transformers>=4.45",
    "unidic-lite>=1.0.8",
    "uvicorn[standard]>=0.30",
    "whisperx>=3.1",
    "yt-dlp>=2024.8",
    # 1.82.0 is yanked upstream for declaring a bad protobuf dependency range.
    "grpcio>=1.68,<1.82",
    # protoc must emit gencode the pinned protobuf runtime accepts. nemo requires
    # protobuf~=5.29.5, which pairs with libprotoc 29.x; grpcio-tools ships that up
    # to 1.71. From 1.73 its bundled protoc jumps to 31.x and the stubs it generates
    # refuse to load against the 5.29 runtime.
    "grpcio-tools>=1.68,<1.72",
    "givemedata-client",
]

# DeepFilterNet's wheel metadata pins numpy<2, but the rest of the stack (nemo,
# numba, torch) needs numpy>=2 and df imports/runs fine against it. Override the
# constraint so numpy is not dragged down, rather than a side --no-deps install.
# whisperx pulls in pyannote-audio, which would otherwise drag torchaudio/torchvision
# down to the torch-2.8 line while our `torch>=2.11` override keeps torch at 2.11 --
# a mismatched torch stack whose C++ extensions fail to load. Force torchaudio and
# torchvision onto the matching 2.11 / 0.26 line so the whole stack stays consistent.
# Adding kokoro makes the resolver try to backtrack nemo-toolkit to 2.1.0 (which pins the
# unbuildable onnx 1.12.0) to fit kokoro's tree. Force nemo/onnx to stay on the newer,
# buildable line so kokoro is resolved against them instead of dragging the ASR stack down,
# and keep transformers on the 4.x line (nemo needs <5).
[tool.uv]
override-dependencies = [
    "numpy>=2.1,<2.5",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "transformers>=4.45,<5",
    "nemo-toolkit>=2.7",
    "onnx>=1.19",
    # f5-tts pulls torchcodec 0.7 (built for torch 2.9 → ABI-incompatible with 2.11).
    # 0.11.1 has the torch-2.11 ABI and an ffmpeg-7 core; force it up.
    "torchcodec==0.11.1",
    "vllm>=0.20,<0.24",
    "packaging>=24.2",
    # fish-speech pins datasets==2.18.0 (old fsspec) which clashes with nemo's fsspec==2024.12.0.
    # Force nemo's fsspec so both resolve (fsspec is backward compatible enough for inference).
    "fsspec==2024.12.0",
    # fish-speech pins pydantic==2.9.2 but vLLM needs >=2.12; force up (pydantic v2 schemas compatible).
    "pydantic>=2.12.0",
    # descript-audiotools (via fish's descript-audio-codec) caps protobuf<3.20; nemo needs 5.29.x. Force up.
    "protobuf>=5.29.5,<5.30",

    "nvidia-cudnn-frontend>=1.18; sys_platform == 'linux'",
    "tokenspeed-mla>=0.1.2; sys_platform == 'linux'",
    "cuda-tile>=1.5.0; sys_platform == 'linux'",
    "nvidia-cutlass-dsl-libs-base>=4.4.2; sys_platform == 'linux'",
    "pyaudio>=0.2.14; sys_platform == 'linux'"
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# vLLM's PyPI wheel is a CUDA-13 build (its _C links libcudart.so.13). Pin vLLM's cu129
# wheel instead: it is CUDA major-12 (links libcudart.so.12), which the cu128 torch stack
# already provides — so Orpheus/vLLM run without migrating the stack off CUDA 12.8.
vllm = [{ url = "https://wheels.vllm.ai/ad7125a431e176d4161099480a66f0169609a690/vllm-0.21.0%2Bcu129-cp38-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux'" }]
# Real Fish Speech / OpenAudio engine (source install; the PyPI `fish-speech` 0.1.0 is a stub).
fish-speech = { git = "https://github.com/fishaudio/fish-speech", rev = "e5e292632cb11e7a27b2b7487f58f612bc101e13" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
monotonic-align = { git = "https://github.com/resemble-ai/monotonic_align.git", rev = "c6e5e6cb19882164027eb6e35118e841eed9298e" }
givemedata-client = { path = "givemedata-client", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*", "runflow*", "runner*", "shared*"]

[tool.pyright]
typeCheckingMode = "standard"
reportUnknownParameterType = true

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.71",
    "mypy-protobuf>=3.6",
    "protobuf>=6.31",
]
